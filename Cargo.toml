[workspace]
resolver = "2"
members = [
    "crates/lightvc-core",
    "crates/lightvc-audio",
    "crates/lightvc-app",
    "crates/lightvc-clap",
    "crates/lightvc-xtask",
]
default-members = [
    "crates/lightvc-core",
    "crates/lightvc-audio",
    "crates/lightvc-app",
    "crates/lightvc-clap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kjranyone/LightVC"

[workspace.dependencies]
cpal = "0.18"
rubato = "3.0"
rtrb = "0.3"
crossbeam-channel = "0.5"
anyhow = "1.0"
hound = "3.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# 人間の動作確認用: release 相当の最適化(実時間推論が動く)のまま LTO を切り、差分ビルドを有効にする
[profile.dev-release]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
